<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mumbai Local Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden; color: #fff; }
  #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; }
  canvas { display: block; }

  /* Header */
  #header {
    position: fixed; top: 0; left: 0; right: 0; height: 60px;
    background: rgba(5,5,20,0.85); backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0,200,255,0.3);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; z-index: 100;
  }
  #logo {
    font-size: 22px; font-weight: 700; letter-spacing: 2px;
    color: #00c8ff;
    text-shadow: 0 0 10px #00c8ff, 0 0 20px #00c8ff, 0 0 40px #0088ff;
    animation: neonPulse 2s ease-in-out infinite alternate;
  }
  @keyframes neonPulse {
    from { text-shadow: 0 0 5px #00c8ff, 0 0 10px #00c8ff, 0 0 20px #0088ff; }
    to   { text-shadow: 0 0 10px #00c8ff, 0 0 25px #00c8ff, 0 0 50px #0088ff, 0 0 80px #0044ff; }
  }
  #logo span { color: #ff6600; text-shadow: 0 0 10px #ff6600, 0 0 20px #ff4400; }
  #clock {
    font-size: 18px; font-weight: 600; color: #00ff88;
    text-shadow: 0 0 8px #00ff88;
    letter-spacing: 3px; font-family: 'Courier New', monospace;
  }
  #header-right { display: flex; align-items: center; gap: 20px; }
  #date-display { font-size: 12px; color: #aaa; text-align: right; }

  /* Left Sidebar */
  #sidebar {
    position: fixed; top: 60px; left: 0; width: 300px; bottom: 120px;
    background: rgba(5,5,20,0.88); backdrop-filter: blur(10px);
    border-right: 1px solid rgba(0,200,255,0.2);
    z-index: 100; overflow: hidden; display: flex; flex-direction: column;
  }
  #sidebar-header {
    padding: 12px 16px; border-bottom: 1px solid rgba(0,200,255,0.2);
    font-size: 13px; font-weight: 700; color: #00c8ff; letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Line selector */
  #line-selector {
    display: flex; padding: 10px 12px; gap: 6px; border-bottom: 1px solid rgba(0,200,255,0.15);
  }
  .line-btn {
    flex: 1; padding: 6px 4px; border: none; border-radius: 4px;
    font-size: 11px; font-weight: 700; cursor: pointer; letter-spacing: 0.5px;
    transition: all 0.2s; opacity: 0.6;
  }
  .line-btn.active { opacity: 1; box-shadow: 0 0 10px currentColor; }
  .line-btn.western { background: #00A651; color: #fff; }
  .line-btn.central { background: #E31837; color: #fff; }
  .line-btn.harbour { background: #003F87; color: #fff; border: 1px solid #4488ff; }
  .line-btn.all     { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.3); }

  /* Search */
  #search-box {
    padding: 8px 12px; border-bottom: 1px solid rgba(0,200,255,0.15);
  }
  #station-search {
    width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,200,255,0.3);
    border-radius: 4px; padding: 7px 10px; color: #fff; font-size: 12px; outline: none;
    transition: border-color 0.2s;
  }
  #station-search:focus { border-color: #00c8ff; }
  #station-search::placeholder { color: rgba(255,255,255,0.4); }

  /* Train list */
  #train-list { overflow-y: auto; flex: 1; padding: 6px 0; }
  #train-list::-webkit-scrollbar { width: 4px; }
  #train-list::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
  #train-list::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.4); border-radius: 2px; }

  .train-card {
    margin: 4px 10px; padding: 8px 10px;
    background: rgba(255,255,255,0.04); border-radius: 6px;
    border-left: 3px solid #333; cursor: pointer;
    transition: background 0.2s; border-top: 1px solid rgba(255,255,255,0.05);
  }
  .train-card:hover { background: rgba(0,200,255,0.08); }
  .train-card .train-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .train-card .train-id { font-size: 13px; font-weight: 700; }
  .train-card .train-status {
    font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 10px;
  }
  .status-ontime { background: rgba(0,200,80,0.2); color: #00cc55; border: 1px solid rgba(0,200,80,0.4); }
  .status-delayed { background: rgba(255,160,0,0.2); color: #ffaa00; border: 1px solid rgba(255,160,0,0.4); }
  .status-cancelled { background: rgba(255,50,50,0.2); color: #ff5050; border: 1px solid rgba(255,50,50,0.4); }
  .train-card .train-route { font-size: 10px; color: rgba(255,255,255,0.5); margin-bottom: 4px; }
  .train-card .train-stations { font-size: 11px; color: rgba(255,255,255,0.8); margin-bottom: 5px; }
  .train-card .train-stations span { color: #00c8ff; }
  .progress-bar-bg {
    height: 3px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden;
  }
  .progress-bar-fill { height: 100%; border-radius: 2px; transition: width 0.1s linear; }

  /* Bottom panel */
  #bottom-panel {
    position: fixed; bottom: 0; left: 300px; right: 0; height: 120px;
    background: rgba(5,5,20,0.88); backdrop-filter: blur(10px);
    border-top: 1px solid rgba(0,200,255,0.2);
    z-index: 100; padding: 10px 16px;
  }
  #bottom-panel h3 {
    font-size: 12px; font-weight: 700; color: #00c8ff; letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 8px;
  }
  #schedule-list { display: flex; gap: 10px; overflow-x: auto; }
  #schedule-list::-webkit-scrollbar { height: 3px; }
  #schedule-list::-webkit-scrollbar-thumb { background: rgba(0,200,255,0.4); border-radius: 2px; }
  .schedule-card {
    min-width: 160px; background: rgba(255,255,255,0.04); border-radius: 6px;
    padding: 8px 10px; border: 1px solid rgba(255,255,255,0.08); flex-shrink: 0;
  }
  .schedule-card .sc-line { font-size: 10px; font-weight: 700; margin-bottom: 3px; }
  .schedule-card .sc-train { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .schedule-card .sc-time { font-size: 11px; color: #00ff88; font-family: 'Courier New', monospace; }
  .schedule-card .sc-dest { font-size: 10px; color: rgba(255,255,255,0.5); }

  /* Station labels */
  .station-label {
    position: fixed; pointer-events: none; z-index: 50;
    font-size: 10px; font-weight: 600; white-space: nowrap;
    padding: 2px 5px; border-radius: 3px;
    background: rgba(5,5,20,0.7); border: 1px solid rgba(255,255,255,0.15);
    transform: translate(-50%, -130%);
    text-shadow: 0 0 4px currentColor;
  }

  /* Status bar */
  #status-bar {
    position: fixed; top: 60px; left: 300px; right: 0; height: 30px;
    background: rgba(5,5,20,0.7); border-bottom: 1px solid rgba(0,200,255,0.15);
    display: flex; align-items: center; padding: 0 16px; gap: 20px; z-index: 99;
    font-size: 11px;
  }
  .stat-item { display: flex; align-items: center; gap: 6px; }
  .stat-dot { width: 7px; height: 7px; border-radius: 50%; }
  .stat-label { color: rgba(255,255,255,0.5); }
  .stat-value { color: #fff; font-weight: 600; }

  /* Night indicator */
  #day-night {
    position: fixed; top: 68px; right: 16px; z-index: 101;
    font-size: 11px; color: rgba(255,255,255,0.5);
  }
</style>
</head>
<body>

<div id="canvas-container"></div>

<!-- Header -->
<div id="header">
  <div id="logo">&#9201; <span>MUMBAI</span> LOCAL TRACKER</div>
  <div id="header-right">
    <div>
      <div id="clock">00:00:00</div>
      <div id="date-display"></div>
    </div>
  </div>
</div>

<!-- Status bar -->
<div id="status-bar">
  <div class="stat-item">
    <div class="stat-dot" style="background:#00cc55;box-shadow:0 0 5px #00cc55"></div>
    <span class="stat-label">System:</span>
    <span class="stat-value">LIVE</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:#00A651;box-shadow:0 0 5px #00A651"></div>
    <span class="stat-label">Western:</span>
    <span class="stat-value">NORMAL</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:#E31837;box-shadow:0 0 5px #E31837"></div>
    <span class="stat-label">Central:</span>
    <span class="stat-value">NORMAL</span>
  </div>
  <div class="stat-item">
    <div class="stat-dot" style="background:#4488ff;box-shadow:0 0 5px #4488ff"></div>
    <span class="stat-label">Harbour:</span>
    <span class="stat-value">NORMAL</span>
  </div>
  <div class="stat-item" style="margin-left:auto">
    <span class="stat-label">Trains Active:</span>
    <span class="stat-value" id="stat-active">13</span>
  </div>
</div>

<div id="day-night">&#9790; Night Mode</div>

<!-- Left Sidebar -->
<div id="sidebar">
  <div id="sidebar-header">&#128642; Live Train Status</div>
  <div id="line-selector">
    <button class="line-btn all active" onclick="filterLine('all')">ALL</button>
    <button class="line-btn western" onclick="filterLine('western')">WR</button>
    <button class="line-btn central" onclick="filterLine('central')">CR</button>
    <button class="line-btn harbour" onclick="filterLine('harbour')">HR</button>
  </div>
  <div id="search-box">
    <input type="text" id="station-search" placeholder="&#128269; Search station..." oninput="filterStation(this.value)">
  </div>
  <div id="train-list"></div>
</div>

<!-- Bottom Panel -->
<div id="bottom-panel">
  <h3>&#128197; Upcoming Departures</h3>
  <div id="schedule-list"></div>
</div>

<!-- Station labels container -->
<div id="labels-container"></div>

<script>
// ====================================================================
// DATA DEFINITIONS
// ====================================================================
const LINE_COLORS_HEX = {
  western: 0x00A651,
  central: 0xE31837,
  harbour: 0x1155cc
};
const LINE_CSS_COLORS = {
  western: '#00A651',
  central: '#E31837',
  harbour: '#4488ff'
};

const STATIONS = {
  western: [
    { id: 'churchgate', name: 'Churchgate', pos: [0, 0, 0] },
    { id: 'mumbai_central', name: 'Mumbai Central', pos: [0, 0, 5] },
    { id: 'dadar_w', name: 'Dadar (W)', pos: [0, 0, 11] },
    { id: 'andheri', name: 'Andheri', pos: [0, 0, 19] },
    { id: 'borivali', name: 'Borivali', pos: [0, 0, 27] },
    { id: 'virar', name: 'Virar', pos: [0, 0, 38] },
  ],
  central: [
    { id: 'csmt', name: 'CSMT', pos: [7, 0, 0] },
    { id: 'dadar_c', name: 'Dadar (C)', pos: [7, 0, 11] },
    { id: 'thane', name: 'Thane', pos: [13, 0, 17] },
    { id: 'kalyan', name: 'Kalyan', pos: [20, 0, 23] },
    { id: 'kasara', name: 'Kasara', pos: [28, 0, 32] },
  ],
  harbour: [
    { id: 'csmt_h', name: 'CSMT', pos: [7, 0, 0] },
    { id: 'kurla', name: 'Kurla', pos: [11, 0, 13] },
    { id: 'vashi', name: 'Vashi', pos: [17, 0, 19] },
    { id: 'panvel', name: 'Panvel', pos: [23, 0, 27] },
  ]
};

const TRAIN_DEFS = [
  { id: '98101', line: 'western',  dir: 1,  seg: 0, prog: 0.0,  name: 'Virar Fast' },
  { id: '98103', line: 'western',  dir: 1,  seg: 2, prog: 0.35, name: 'Borivali Fast' },
  { id: '98105', line: 'western',  dir: -1, seg: 4, prog: 0.7,  name: 'Churchgate Slow' },
  { id: '98107', line: 'western',  dir: 1,  seg: 1, prog: 0.5,  name: 'Andheri Slow' },
  { id: '11001', line: 'central',  dir: 1,  seg: 0, prog: 0.2,  name: 'Kasara Fast' },
  { id: '11003', line: 'central',  dir: 1,  seg: 2, prog: 0.6,  name: 'Kalyan Fast' },
  { id: '11005', line: 'central',  dir: -1, seg: 3, prog: 0.4,  name: 'CSMT Express' },
  { id: '21001', line: 'harbour',  dir: 1,  seg: 0, prog: 0.1,  name: 'Panvel Fast' },
  { id: '21003', line: 'harbour',  dir: 1,  seg: 1, prog: 0.8,  name: 'Vashi Local' },
  { id: '21005', line: 'harbour',  dir: -1, seg: 2, prog: 0.5,  name: 'CSMT Local' },
  { id: '98109', line: 'western',  dir: -1, seg: 3, prog: 0.25, name: 'Mumbai Central Fast' },
  { id: '11007', line: 'central',  dir: 1,  seg: 1, prog: 0.9,  name: 'Thane Local' },
  { id: '21007', line: 'harbour',  dir: 1,  seg: 0, prog: 0.55, name: 'Kurla Special' },
];

// ====================================================================
// THREE.JS GLOBALS
// ====================================================================
let scene, camera, renderer, controls, clock3d;
let ambientLight, sunLight, moonLight;
let trainObjects = [];   // {def, group, particles, particleData}
let stationSpheres = []; // {mesh, baseY}
let labelData = [];      // {el, worldPos, line}
let totalElapsed = 0;
let activeFilter = 'all';
let searchFilter = '';

// ====================================================================
// SCENE INIT
// ====================================================================
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020208);
  scene.fog = new THREE.FogExp2(0x020208, 0.016);

  camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 600);
  camera.position.set(-22, 32, -12);
  camera.lookAt(10, 0, 16);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.getElementById('canvas-container').appendChild(renderer.domElement);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.autoRotate = true;
  controls.autoRotateSpeed = 0.25;
  controls.minDistance = 8;
  controls.maxDistance = 130;
  controls.maxPolarAngle = Math.PI / 2.05;
  controls.target.set(10, 0, 16);

  clock3d = new THREE.Clock();

  buildLighting();
  buildGround();
  buildGridFloor();
  buildTracks();
  buildStations();
  buildTrains();
  buildSkyline();
  buildSea();
  buildStars();

  window.addEventListener('resize', onResize);
}

// ====================================================================
// LIGHTING
// ====================================================================
function buildLighting() {
  ambientLight = new THREE.AmbientLight(0x112244, 0.9);
  scene.add(ambientLight);

  sunLight = new THREE.DirectionalLight(0xffeedd, 0.0);
  sunLight.position.set(50, 80, 30);
  sunLight.castShadow = true;
  sunLight.shadow.mapSize.width = 2048;
  sunLight.shadow.mapSize.height = 2048;
  sunLight.shadow.camera.near = 0.5;
  sunLight.shadow.camera.far = 200;
  sunLight.shadow.camera.left = -70;
  sunLight.shadow.camera.right = 70;
  sunLight.shadow.camera.top = 70;
  sunLight.shadow.camera.bottom = -70;
  scene.add(sunLight);

  moonLight = new THREE.DirectionalLight(0x334466, 1.0);
  moonLight.position.set(-40, 60, -20);
  scene.add(moonLight);

  const cityGlow = new THREE.HemisphereLight(0x001133, 0x110022, 0.6);
  scene.add(cityGlow);
}

// ====================================================================
// GROUND
// ====================================================================
function buildGround() {
  const geo = new THREE.PlaneGeometry(250, 250);
  const mat = new THREE.MeshStandardMaterial({
    color: 0x060612, roughness: 0.95, metalness: 0.05
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.rotation.x = -Math.PI / 2;
  mesh.position.y = -0.12;
  mesh.receiveShadow = true;
  scene.add(mesh);
}

function buildGridFloor() {
  const grid = new THREE.GridHelper(220, 90, 0x001133, 0x000d22);
  grid.position.y = 0.005;
  scene.add(grid);
}

// ====================================================================
// TRACKS
// ====================================================================
function buildTracks() {
  Object.keys(STATIONS).forEach(line => {
    const sts = STATIONS[line];
    const col = LINE_COLORS_HEX[line];
    for (let i = 0; i < sts.length - 1; i++) {
      const a = new THREE.Vector3(...sts[i].pos);
      const b = new THREE.Vector3(...sts[i+1].pos);
      buildTrackSegment(a, b, col);
    }
  });
}

function buildTrackSegment(a, b, color) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const mid = new THREE.Vector3().addVectors(a, b).multiplyScalar(0.5);

  const railMat = new THREE.MeshStandardMaterial({
    color: color, emissive: color, emissiveIntensity: 0.55,
    metalness: 0.85, roughness: 0.15
  });

  // Two parallel rails
  [-0.38, 0.38].forEach(offset => {
    const railGeo = new THREE.BoxGeometry(0.16, 0.1, len);
    const rail = new THREE.Mesh(railGeo, railMat);
    rail.position.copy(mid);
    rail.position.y = 0.05;
    rail.lookAt(new THREE.Vector3(b.x, 0.05, b.z));
    rail.translateX(offset);
    scene.add(rail);
  });

  // Sleepers
  const sleeperCount = Math.max(2, Math.floor(len / 0.75));
  const sleeperGeo = new THREE.BoxGeometry(1.3, 0.07, 0.22);
  const sleeperMat = new THREE.MeshStandardMaterial({ color: 0x3a2810, roughness: 0.95 });
  for (let i = 0; i < sleeperCount; i++) {
    const t = (i + 0.5) / sleeperCount;
    const p = new THREE.Vector3().lerpVectors(a, b, t);
    const sl = new THREE.Mesh(sleeperGeo, sleeperMat);
    sl.position.set(p.x, 0.01, p.z);
    sl.lookAt(new THREE.Vector3(b.x, 0.01, b.z));
    sl.receiveShadow = true;
    scene.add(sl);
  }

  // Glow underlay
  const glowGeo = new THREE.BoxGeometry(0.04, 0.04, len);
  const glowMat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: 0.35 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  glow.position.copy(mid);
  glow.position.y = 0.0;
  glow.lookAt(new THREE.Vector3(b.x, 0.0, b.z));
  scene.add(glow);
}

// ====================================================================
// STATIONS
// ====================================================================
function buildStations() {
  const labelContainer = document.getElementById('labels-container');
  Object.keys(STATIONS).forEach(line => {
    STATIONS[line].forEach(station => {
      const px = station.pos[0], py = station.pos[1], pz = station.pos[2];
      const color = LINE_COLORS_HEX[line];
      const cssCol = LINE_CSS_COLORS[line];

      // Platform slab
      const platGeo = new THREE.BoxGeometry(2.6, 0.18, 1.9);
      const platMat = new THREE.MeshStandardMaterial({ color: 0x1a1a33, roughness: 0.75 });
      const plat = new THREE.Mesh(platGeo, platMat);
      plat.position.set(px, 0.09, pz);
      plat.receiveShadow = true;
      scene.add(plat);

      // Roof canopy
      const canopyGeo = new THREE.BoxGeometry(2.8, 0.06, 2.1);
      const canopyMat = new THREE.MeshStandardMaterial({
        color: color, emissive: color, emissiveIntensity: 0.2, metalness: 0.6
      });
      const canopy = new THREE.Mesh(canopyGeo, canopyMat);
      canopy.position.set(px, 1.5, pz);
      scene.add(canopy);

      // Glowing sphere
      const sphereGeo = new THREE.SphereGeometry(0.32, 16, 16);
      const sphereMat = new THREE.MeshStandardMaterial({
        color: color, emissive: color, emissiveIntensity: 1.0,
        metalness: 0.4, roughness: 0.2
      });
      const sphere = new THREE.Mesh(sphereGeo, sphereMat);
      sphere.position.set(px, 1.0, pz);
      scene.add(sphere);
      stationSpheres.push({ mesh: sphere, baseY: 1.0 });

      // Point light
      const stLight = new THREE.PointLight(color, 0.9, 7);
      stLight.position.set(px, 1.8, pz);
      scene.add(stLight);

      // HTML label
      const el = document.createElement('div');
      el.className = 'station-label';
      el.textContent = station.name;
      el.style.color = cssCol;
      el.dataset.line = line;
      labelContainer.appendChild(el);
      labelData.push({
        el,
        worldPos: new THREE.Vector3(px, 1.5, pz),
        line
      });
    });
  });
}

// ====================================================================
// TRAINS
// ====================================================================
function buildTrains() {
  TRAIN_DEFS.forEach(def => {
    const color = LINE_COLORS_HEX[def.line];
    const group = new THREE.Group();

    // Main body
    const bodyGeo = new THREE.BoxGeometry(0.85, 0.52, 2.3);
    const bodyMat = new THREE.MeshStandardMaterial({
      color: color, emissive: color, emissiveIntensity: 0.1,
      metalness: 0.75, roughness: 0.25
    });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.52;
    body.castShadow = true;
    group.add(body);

    // Roof
    const roofGeo = new THREE.BoxGeometry(0.8, 0.1, 2.2);
    const roofMat = new THREE.MeshStandardMaterial({ color: 0x999999, metalness: 0.9, roughness: 0.15 });
    const roof = new THREE.Mesh(roofGeo, roofMat);
    roof.position.y = 0.83;
    group.add(roof);

    // Window strip
    const winGeo = new THREE.BoxGeometry(0.87, 0.17, 1.9);
    const winMat = new THREE.MeshStandardMaterial({
      color: 0x88ccff, emissive: 0x3388aa, emissiveIntensity: 0.6,
      transparent: true, opacity: 0.8, roughness: 0.05
    });
    const win = new THREE.Mesh(winGeo, winMat);
    win.position.y = 0.55;
    group.add(win);

    // Front headlight box
    const hlGeo = new THREE.BoxGeometry(0.22, 0.1, 0.05);
    const hlMat = new THREE.MeshBasicMaterial({ color: 0xffffee });
    const hl = new THREE.Mesh(hlGeo, hlMat);
    hl.position.set(0, 0.48, 1.15);
    group.add(hl);

    // Headlight point light
    const hlLight = new THREE.PointLight(0xfff8cc, 2.0, 9);
    hlLight.position.set(0, 0.7, 1.3);
    group.add(hlLight);

    // Wheels
    [-0.65, 0.65].forEach(xo => {
      [-0.65, 0.65].forEach(zo => {
        const wGeo = new THREE.CylinderGeometry(0.14, 0.14, 0.09, 10);
        const wMat = new THREE.MeshStandardMaterial({ color: 0x222222, metalness: 0.9 });
        const w = new THREE.Mesh(wGeo, wMat);
        w.rotation.z = Math.PI / 2;
        w.position.set(xo, 0.16, zo);
        group.add(w);
      });
    });

    scene.add(group);

    // Particle system
    const PART_COUNT = 25;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(PART_COUNT * 3);
    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
      color: color, size: 0.14, transparent: true, opacity: 0.65,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const pts = new THREE.Points(pGeo, pMat);
    scene.add(pts);

    const particleData = [];
    for (let i = 0; i < PART_COUNT; i++) {
      particleData.push({ life: Math.random(), ox: (Math.random()-0.5)*0.6, oy: Math.random()*0.6, oz: (Math.random()-0.5)*0.6 });
    }

    trainObjects.push({ def: JSON.parse(JSON.stringify(def)), group, particles: pts, particleData });
  });
}

// ====================================================================
// SKYLINE
// ====================================================================
function buildSkyline() {
  const placements = [
    [30,2,8],[35,6,5],[32,-3,10],[38,2,7],[28,4,9],
    [-8,5,7],[-12,3,9],[-5,8,6],[-15,1,5],[-18,4,8],
    [20,-5,6],[22,-9,9],[18,-3,7],[16,-7,5],
    [5,-7,5],[8,-4,8],[3,-10,6],[1,-5,7],
    [25,30,4],[27,28,5],[30,25,6],
  ];
  placements.forEach(([bx, bz, h]) => {
    const w = 1.5 + Math.random() * 2.5;
    const d = 1.5 + Math.random() * 2.5;
    const geo = new THREE.BoxGeometry(w, h, d);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x080818, emissive: 0x0a0a22, emissiveIntensity: 0.25, roughness: 0.9
    });
    const b = new THREE.Mesh(geo, mat);
    b.position.set(bx, h / 2, bz);
    b.castShadow = true;
    scene.add(b);

    // Window lights on building faces
    const rows = Math.floor(h * 1.3);
    for (let r = 0; r < rows; r++) {
      if (Math.random() > 0.45) {
        const wGeo = new THREE.BoxGeometry(0.18, 0.17, 0.04);
        const wCol = Math.random() > 0.5 ? 0xffee88 : 0x88bbff;
        const wMat = new THREE.MeshBasicMaterial({ color: wCol, transparent: true, opacity: 0.5 + Math.random() * 0.4 });
        const wm = new THREE.Mesh(wGeo, wMat);
        wm.position.set(
          bx + (Math.random() - 0.5) * (w * 0.7),
          Math.random() * h * 0.85 + 0.4,
          bz + d / 2 + 0.02
        );
        scene.add(wm);
      }
    }
  });
}

// ====================================================================
// STARS
// ====================================================================
function buildStars() {
  const count = 900;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    pos[i*3]   = (Math.random() - 0.5) * 500;
    pos[i*3+1] = 35 + Math.random() * 120;
    pos[i*3+2] = (Math.random() - 0.5) * 500;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff, size: 0.28, transparent: true, opacity: 0.85,
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  scene.add(new THREE.Points(geo, mat));
}

// ====================================================================
// TRAIN ANIMATION
// ====================================================================
function getSegmentEndpoints(line, seg, dir) {
  const sts = STATIONS[line];
  const maxIdx = sts.length - 1;
  let ai, bi;
  if (dir >= 0) {
    ai = Math.min(seg, maxIdx);
    bi = Math.min(seg + 1, maxIdx);
  } else {
    ai = Math.max(maxIdx - seg, 0);
    bi = Math.max(maxIdx - seg - 1, 0);
  }
  return {
    a: new THREE.Vector3(...sts[ai].pos),
    b: new THREE.Vector3(...sts[bi].pos),
    aName: sts[ai].name,
    bName: sts[bi].name
  };
}

function updateTrains(dt) {
  const BASE_SPEED = 0.045;
  trainObjects.forEach(to => {
    const def = to.def;
    const maxSeg = STATIONS[def.line].length - 2;

    def.prog += BASE_SPEED * dt * (0.85 + Math.sin(totalElapsed * 0.3 + def.seg) * 0.1);
    if (def.prog >= 1.0) {
      def.prog -= 1.0;
      def.seg++;
      if (def.seg > maxSeg) {
        def.seg = 0;
        def.dir *= -1;
      }
    }

    const ep = getSegmentEndpoints(def.line, def.seg, def.dir);
    const pos = new THREE.Vector3().lerpVectors(ep.a, ep.b, def.prog);
    to.group.position.set(pos.x, 0, pos.z);

    // Orient along travel direction
    const ahead = new THREE.Vector3().lerpVectors(ep.a, ep.b, Math.min(def.prog + 0.02, 1.0));
    if (!ahead.equals(pos)) {
      to.group.lookAt(ahead.x, 0, ahead.z);
    }

    // Particles
    const pArr = to.particles.geometry.attributes.position.array;
    to.particleData.forEach((p, pi) => {
      p.life -= dt * 2.2;
      if (p.life <= 0) {
        p.life = 1.0;
        p.ox = (Math.random()-0.5)*0.7;
        p.oy = Math.random()*0.7;
        p.oz = (Math.random()-0.5)*0.7;
      }
      const age = 1 - p.life;
      pArr[pi*3]   = pos.x + p.ox * age * 2;
      pArr[pi*3+1] = 0.9  + p.oy * age * 1.8;
      pArr[pi*3+2] = pos.z + p.oz * age * 2;
    });
    to.particles.geometry.attributes.position.needsUpdate = true;
  });
}

// ====================================================================
// DAY/NIGHT CYCLE
// ====================================================================
function updateDayNight() {
  const cycle = (Math.sin(totalElapsed * 0.018) + 1) / 2; // 0=night 1=day
  const day = Math.max(0, cycle - 0.3) / 0.7;

  sunLight.intensity  = day * 1.3;
  moonLight.intensity = (1 - day) * 0.85;
  ambientLight.intensity = 0.35 + day * 0.65;

  const nightBg = new THREE.Color(0x020208);
  const dayBg   = new THREE.Color(0x091525);
  scene.background = nightBg.lerp(dayBg, day * 0.5);
  scene.fog.color.copy(scene.background);

  document.getElementById('day-night').textContent = day > 0.35 ? '☀ Day Mode' : '☾ Night Mode';
}

// ====================================================================
// STATION PULSE
// ====================================================================
function animateStations(t) {
  stationSpheres.forEach((ss, i) => {
    ss.mesh.position.y = ss.baseY + Math.sin(t * 1.8 + i * 0.7) * 0.09;
    ss.mesh.material.emissiveIntensity = 0.7 + Math.sin(t * 2.5 + i * 0.4) * 0.3;
  });
}

// ====================================================================
// LABEL PROJECTION
// ====================================================================
function updateLabels() {
  labelData.forEach(ld => {
    if (activeFilter !== 'all' && ld.line !== activeFilter) {
      ld.el.style.display = 'none';
      return;
    }
    ld.el.style.display = 'block';
    const v = ld.worldPos.clone().project(camera);
    const sx = (v.x *  0.5 + 0.5) * window.innerWidth;
    const sy = (v.y * -0.5 + 0.5) * window.innerHeight;
    if (v.z > 1 || sx < 0 || sx > window.innerWidth || sy < 0 || sy > window.innerHeight) {
      ld.el.style.display = 'none';
    } else {
      ld.el.style.left = sx + 'px';
      ld.el.style.top  = sy + 'px';
    }
  });
}

// ====================================================================
// UI: CLOCK
// ====================================================================
function updateClock() {
  const now = new Date();
  const utcMs = now.getTime() + now.getTimezoneOffset() * 60000;
  const ist = new Date(utcMs + 5.5 * 3600000);
  const H = String(ist.getHours()).padStart(2,'0');
  const M = String(ist.getMinutes()).padStart(2,'0');
  const S = String(ist.getSeconds()).padStart(2,'0');
  document.getElementById('clock').textContent = `${H}:${M}:${S}`;
  const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  document.getElementById('date-display').textContent =
    `${DAYS[ist.getDay()]}, ${ist.getDate()} ${MONTHS[ist.getMonth()]} ${ist.getFullYear()} IST`;
}

// ====================================================================
// UI: TRAIN LIST
// ====================================================================
const STATUS_POOL = ['ON TIME','ON TIME','ON TIME','ON TIME','DELAYED','ON TIME','CANCELLED','ON TIME','DELAYED','ON TIME'];

function updateTrainList() {
  const list = document.getElementById('train-list');
  const sFilter = searchFilter;
  let html = '';
  trainObjects.forEach((to, idx) => {
    const def = to.def;
    if (activeFilter !== 'all' && def.line !== activeFilter) return;
    const ep = getSegmentEndpoints(def.line, def.seg, def.dir);
    if (sFilter && !ep.aName.toLowerCase().includes(sFilter) && !ep.bName.toLowerCase().includes(sFilter)) return;

    const col = LINE_CSS_COLORS[def.line];
    const statusSeed = (idx * 7 + Math.floor(Date.now() / 45000)) % STATUS_POOL.length;
    const status = STATUS_POOL[statusSeed];
    const sCls = status === 'ON TIME' ? 'status-ontime' : status === 'DELAYED' ? 'status-delayed' : 'status-cancelled';
    const pct = Math.round(def.prog * 100);
    const dir = def.dir > 0 ? '&#9660; DOWN' : '&#9650; UP';
    html += `
      <div class="train-card" style="border-left-color:${col}">
        <div class="train-top">
          <span class="train-id" style="color:${col}">${def.id}</span>
          <span class="train-status ${sCls}">${status}</span>
        </div>
        <div class="train-route">${def.line.toUpperCase()} LINE &bull; ${dir}</div>
        <div class="train-stations">At: <span>${ep.aName}</span> &rarr; ${ep.bName}</div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" style="width:${pct}%;background:${col}"></div>
        </div>
      </div>`;
  });
  list.innerHTML = html || '<div style="padding:16px;color:rgba(255,255,255,0.3);font-size:12px;text-align:center">No trains found</div>';
}

// ====================================================================
// FILTERS
// ====================================================================
function filterLine(line) {
  activeFilter = line;
  document.querySelectorAll('.line-btn').forEach(b => b.classList.remove('active'));
  const btns = document.querySelectorAll('.line-btn');
  const map = { all:0, western:1, central:2, harbour:3 };
  if (map[line] !== undefined) btns[map[line]].classList.add('active');
  updateTrainList();
}

function filterStation(val) {
  searchFilter = val.toLowerCase().trim();
  updateTrainList();
}

// ====================================================================
// RESIZE
// ====================================================================
function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// ====================================================================
// MAIN LOOP
// ====================================================================
let lastUI = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock3d.getDelta(), 0.05);
  totalElapsed += dt;

  controls.update();
  updateTrains(dt);
  animateStations(totalElapsed);
  updateDayNight();
  updateLabels();

  const now = Date.now();
  if (now - lastUI > 400) {
    updateClock();
    updateTrainList();
    updateSchedules();
    lastUI = now;
  }

  renderer.render(scene, camera);
}

// ====================================================================
// BOOT
// ====================================================================
try {
  initScene();
  animate();
} catch (err) {
  console.error(err);
  document.body.style.background = '#0a0a1a';
  document.body.innerHTML = `
    <div style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
      background:rgba(200,0,0,0.85);padding:30px 40px;border-radius:10px;
      z-index:9999;color:#fff;text-align:center;max-width:500px">
      <h2 style="margin-bottom:10px">&#9888; Scene Error</h2>
      <p style="font-size:14px">${err.message}</p>
      <p style="font-size:12px;margin-top:10px;opacity:0.7">Check browser console for details.</p>
    </div>`;
}
